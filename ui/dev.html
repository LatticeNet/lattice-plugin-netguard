<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetGuard dev harness</title>
    <style>
      :root { color-scheme: dark; --chrome: #1b1714; --chrome-fg: #f1ece6; --chrome-line: #332c27; --page: #181513; }
      :root[data-theme="light"] { color-scheme: light; --chrome: #efece6; --chrome-fg: #241e1a; --chrome-line: #d9d3c9; --page: #fbfaf7; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 12px ui-sans-serif, system-ui, sans-serif; background: var(--chrome); color: var(--chrome-fg); }
      .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 8px 14px; border-bottom: 1px solid var(--chrome-line); }
      .bar label { display: inline-flex; align-items: center; gap: 6px; }
      .bar select, .bar button { border: 1px solid var(--chrome-line); border-radius: 4px; padding: 3px 7px; background: transparent; color: inherit; font: inherit; }
      /* The console's main region. The frame fills it exactly and clips, so the
         plugin document scrolls inside the frame and nothing scrolls outside
         it, exactly as the real dashboard behaves. */
      .viewport { overflow: hidden; border-bottom: 1px solid var(--chrome-line); background: var(--page); resize: vertical; }
      .frame-wrap { position: relative; height: 100%; margin: 0 auto; }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
    </style>
  </head>
  <body>
    <script type="module" src="/dev/host.ts"></script>
  </body>
</html>
